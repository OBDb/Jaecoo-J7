    description: "The Jaecoo J7 (also known as Jaecoo 7) is the inaugural model from Jaecoo, a premium sub-brand of Chery Automobile launched in 2023. Built on Chery's T1X platform, this compact crossover SUV (C-segment) features rugged yet sophisticated styling with a bold front grille, matrix LED headlights, and distinctive design elements. Available powertrains include a 1.6-liter turbocharged petrol engine producing approximately 197 HP paired with a 7-speed dual-clutch transmission (available in FWD and AWD), and a 1.5-liter turbocharged plug-in hybrid system (SHS/C-DM) delivering around 326 HP with an electric range rated at approximately 80-106 km. The interior features a minimalist dashboard with a 14.8-inch touchscreen powered by a Qualcomm 8155 chip, supporting FOTA updates, facial recognition, and Level 2+ driver assistance. The Jaecoo J7 is marketed globally across Europe, UK, Australia, New Zealand, Russia, South Africa, Southeast Asia, Latin America, and the Middle East. In China, the vehicle is sold as the Chery Tansuo 06 (also known as Chery Tiggo 7 High Energy or Fulwin T6 for PHEV variants)."
